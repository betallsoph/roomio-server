# Deploy roomio-server → VPS API (140.245.59.215)
# Thư mục trên server: /home/ubuntu/roomio-server
#
# GitHub Secrets (repo roomio-server):
#   DEPLOY_HOST     = 140.245.59.215
#   DEPLOY_USER     = ubuntu
#   DEPLOY_SSH_KEY  = nội dung file ssh-key-2026-06-17.key
#   DEPLOY_PATH     = /home/ubuntu/roomio-server

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "==> Pull latest code"
            git fetch origin master
            git reset --hard origin/master

            echo "==> Build & restart (arm64 native on VPS)"
            if [ ! -f .env ] || ! grep -Eq '^SUPER_ADMIN_ACCOUNTS=.+$' .env; then
              echo "::error::SUPER_ADMIN_ACCOUNTS is missing in the VPS .env. Production cannot boot safely without an admin account."
              exit 1
            fi
            export RELEASE_SHA="$(git rev-parse HEAD)"
            for name in BOT_TOKEN BOT_USERNAME MINIAPP_SHORT_NAME TELEGRAM_WEBHOOK_SECRET CRON_SECRET; do
              if [ ! -f .env ] || ! grep -Eq "^${name}=.+$" .env; then
                echo "::error::${name} is missing in the VPS .env. Production boot requirements are incomplete."
                exit 1
              fi
            done
            docker compose up -d --build --remove-orphans

            echo "==> Wait for API readiness"
            chmod +x scripts/wait-for-readiness.sh
            ./scripts/wait-for-readiness.sh http://127.0.0.1:3000/api/health/ready 30 2

            docker compose ps
            docker image prune -f
