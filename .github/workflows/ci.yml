name: CI

on:
  push:
    branches:
      - master
      - refactor/production-hardening
  pull_request:
    branches:
      - master
      - refactor/production-hardening

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roomio
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: roomio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomio -d roomio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://roomio:ci_test_password@localhost:5432/roomio_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Runtime versions
        run: |
          node --version
          npm --version

      - run: npm ci

      - name: Migrate test database from zero
        run: npm run db:migrate

      - name: Check migration drift
        run: npm run db:check

      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - name: Run security integration tests
        run: npm run test:security
        env:
          SECURITY_INTEGRATION: '1'
      - run: npm run build
        env:
          PGLITE_DIR: memory://roomio-build

  docker:
    name: Docker build (linux/arm64)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: roomio-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
